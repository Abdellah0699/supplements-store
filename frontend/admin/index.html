<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Store Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <main class="login-page">
    <div class="card login-card">
      <span class="admin-brand-mark" aria-hidden="true">S</span>
      <h1>Store Admin</h1>
      <p class="login-sub">Sign in to manage products, orders and delivery.</p>

      <form id="login-form" novalidate>
        <div class="form-grid" style="grid-template-columns:1fr;">
          <div class="form-field">
            <label for="login-username">Username</label>
            <input class="input" id="login-username" name="username" type="text"
                   autocomplete="username" required>
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input class="input" id="login-password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>
        </div>

        <p class="field-error" id="login-error" role="alert" style="display:none;"></p>

        <div class="form-actions" style="border-top:none;margin-top:8px;padding-top:0;">
          <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">
            Sign in
          </button>
        </div>
      </form>

      <div class="login-note">
        Authorized store staff only. Your sign-in is protected by the server.
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
